<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SpendWise - a simple expense tracker with budgets, reports and dark mode.">
  <meta name="theme-color" content="#10b981">
  <title>Dashboard - SpendWise</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index.html">
  <section class="hero">
    <p class="greeting" id="greeting">Welcome back 👋</p>
    <p class="hero-label" id="periodLabel">Total Balance</p>
    <h1 id="balance">₹0.00</h1>
    <div class="summary">
      <div class="card"><span>Income</span><strong id="income">₹0.00</strong></div>
      <div class="card"><span>Expenses</span><strong id="expense">₹0.00</strong></div>
      <div class="card"><span>Savings rate</span><strong id="savings">0%</strong></div>
    </div>
  </section>

  <main class="container two-col">
    <section class="panel">
      <h2>Spending Breakdown</h2>
      <div id="chart"></div>
    </section>

    <section class="panel">
      <h2>Monthly Budget</h2>
      <div id="budgetBox"></div>
    </section>

    <section class="panel wide">
      <div class="list-head">
        <h2>Recent Transactions</h2>
        <a class="link" href="transactions.html">View all →</a>
      </div>
      <ul id="list" class="list"></ul>
      <a class="btn block" href="transactions.html">+ Add transaction</a>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
